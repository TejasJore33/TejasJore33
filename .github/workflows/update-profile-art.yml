name: Update profile art

# Redraws the animated contribution graph from real GitHub data every 6 hours.
# Commits are made by github-actions[bot] and do not count as profile contributions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/profile.json", "data/ascii.txt", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and merge contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-contributions.mjs
      - name: Render SVGs
        run: node scripts/render.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets data; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git commit -m "Update profile art"
          git push
